<!DOCTYPE html>

:root {

* { margin:0; padding:0; box-sizing:border-box; }

body {

}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Container */
.container { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; position: relative; z-index: 1; }

/* Loading */
.loading { text-align: center; padding: 80px 20px; }
.loader {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);

  animation: spin .8s linear infinite;

}

/* Error */
.error-box { text-align: center; padding: 80px 20px; }
.error-box .err-icon { font-size: 3rem; margin-bottom: 16px; }
.error-box p { color: var(--text-dim); margin-bottom: 12px; }

  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: 12px;
  font-size: 1rem; cursor: pointer; transition: .3s;
  font-weight: 600;
}
.file-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,99,255,.3); }
#fileInput { display: none; }

/* Series Card */
/* Series List (clean) */
.series-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
  animation: cardIn .4s ease both;
}
.series-row:last-child { border-bottom: none; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.series-name {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: .2s;
}
.series-name:hover { color: var(--accent2); }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .3px;
  white-space: nowrap;
}
.badge-red { background: rgba(255,71,87,.15); color: var(--red); border: 1px solid rgba(255,71,87,.2); }
.badge-green { background: rgba(46,213,115,.12); color: var(--green); border: 1px solid rgba(46,213,115,.2); }
.badge-gray { background: rgba(255,255,255,.06); color: var(--text-dim); border: 1px solid var(--border); }
.solo-stat { display:inline-flex; align-items:center; padding:2px 8px; border-radius:8px; font-size:.68rem; font-weight:700; white-space:nowrap; }
.solo-ok { background: rgba(46,213,115,.12); color: var(--green); border:1px solid rgba(46,213,115,.2); }
.solo-none { background: rgba(255,71,87,.12); color: var(--red); border:1px solid rgba(255,71,87,.2); }

.highlight { background: rgba(108,99,255,.35); border-radius: 3px; padding: 0 2px; color: #fff; }

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.no-results .big { font-size: 3rem; margin-bottom: 12px; }

/* Light Theme */
body.light { --bg: #f5f6fa; --card: #fff; --card-hover: #f8f9ff; --text: #2c3e50; --text-dim: #95a5a6; --border: rgba(0,0,0,.08); --glow: rgba(108,99,255,.08); }
body.light .sticky-header { background: rgba(245,246,250,.9); }
body.light .search-box { background: rgba(0,0,0,.04); color: #2c3e50; }
body.light .highlight { background: rgba(108,99,255,.2); color: #2c3e50; }

/* Progress bar */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  z-index: 200;
  transition: width .3s;
  border-radius: 0 3px 3px 0;
}

/* Scroll to top */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  transition: .3s;
  z-index: 90;
  box-shadow: 0 4px 15px rgba(108,99,255,.3);
}
.scroll-top.show { opacity: 1; transform: translateY(0); }

@media(max-width:600px) {
  .sticky-header { padding: 12px 14px 10px; }
  .logo { font-size: 1.2rem; }
  .stat-pill { padding: 4px 10px; font-size: .76rem; }
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar" style="width:0%"></div>

<div class="sticky-header">
  <div class="header-inner">
    <div class="top-row">
      <span class="logo">⚡ 课程系列总览</span>
      <button class="theme-toggle" id="themeBtn" title="切换主题">🌙</button>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" class="search-box" id="searchBox" placeholder="搜索系列名…" autocomplete="off">
      </div>
      <span class="search-count" id="searchCount"></span>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="normal">正常</button>
      <button class="chip" data-filter="offline">下架</button>
      <button class="chip" data-filter="purchased">已购买</button>
      <button class="chip" data-filter="cansell">有可单买</button>
    </div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="loading" id="loadingEl">
    <div class="loader"></div>
    <p>正在加载数据…</p>
  </div>
</div>

<button class="scroll-top" id="scrollTopBtn" title="回到顶部">↑</button>

<script>
const CSV_URL = 'https://zhzx2026.github.io/weishi-scan/data/courses/courses_data.csv';
let allSeries = [];
let currentFilter = 'all';

/* ── CSV Parsing ── */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = [];
  let cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === '\n') { lines.push(cur); cur = ''; }
      else if (ch !== '\r') cur += ch;
    }
  }
  if (cur.trim()) lines.push(cur);
  if (lines.length < 2) return [];
  const headers = splitLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = splitLine(lines[i]);
    if (vals.length < 2) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx]||'').trim());
    rows.push(obj);
  }
  return rows;
}

function splitLine(line) {
  const r = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') { if (line[i+1]==='"'){cur+='"';i++;}else inQ=false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { r.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  r.push(cur);
  return r;
}

/* ── Data Processing ── */
function processData(rows) {
  const map = {};
  rows.forEach(r => {
    const sid = r.series_id || 'unknown';
    if (!map[sid]) map[sid] = { series_id: sid, series_name: r.series_name||'未知系列', series_status: r.series_status||'', courses: [] };
    map[sid].courses.push({
      course_id: r.course_id, course_name: r.course_name||'', course_url: r.course_url||'',
      class_name: r.class_name||'', price: r.price||'', start_time: r.start_time||'',
      learn_cnt: parseInt(r.learn_cnt)||0, can_sell_alone: r.can_sell_alone||'', purchase_status: r.purchase_status||''
    });
  });
  const list = Object.values(map);
  list.forEach(s => {
    s.courses.sort((a,b) => (a.start_time||'').localeCompare(b.start_time||''));
    s.latestTime = '';
    s.hasCanSell = false;
    s.soloCount = 0;
    s.totalCount = s.courses.length;
    for (let i = s.courses.length-1; i >= 0; i--) {
      if (s.courses[i].start_time && !s.latestTime) s.latestTime = s.courses[i].start_time;
    }
    s.courses.forEach(c => {
      if (c.can_sell_alone === '是') { s.hasCanSell = true; s.soloCount++; }
    });
  });
  list.sort((a,b) => (b.latestTime||'').localeCompare(a.latestTime||''));
  return list;
}

/* ── Stats ── */
function updateStats(series) {
  let tc=0, cs=0, off=0, purchased=0, soloSeries=0;
  series.forEach(s => {
    tc += s.courses.length;
    if (s.series_status==='下架') off++;
    if (s.series_status==='已购买') purchased++;
    if (s.hasCanSell) soloSeries++;
    cs += s.soloCount || 0;
  });
  document.getElementById('statsBar').innerHTML =
    pill('📦',series.length,'个系列') +
    pill('🛒',cs,'门可单买') +
    pill('✨',soloSeries,'个系列有可单买') +
    pill('🔻',off,'系列下架') +
    pill('✅',purchased,'已购买');
}
function pill(icon,num,label) {
  return `<span class="stat-pill">${icon} <span class="num">${num}</span> ${label}</span>`;
}

/* ── Helpers ── */
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function hl(text, q) {
  if (!q) return esc(text);
  const e = esc(text), qe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(qe,'gi'), m => `<span class="highlight">${m}</span>`);
}
function shortDate(dt) { const m=dt.match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:dt; }
function statusBadge(st) {
  if (st==='下架') return '<span class="badge badge-red">⛔ 下架</span>';
  if (st==='已购买') return '<span class="badge badge-gray">✅ 已购买</span>';
  if (st==='正常') return '<span class="badge badge-green">🟢 正常</span>';
  return `<span class="badge badge-gray">${esc(st)}</span>`;
}

/* 系列可单买统计 [x/y] */
function soloStat(s) {
  const x = s.soloCount || 0, y = s.totalCount || 0;
  return `<span class="solo-stat ${x>0?'solo-ok':'solo-none'}">可单买[${x}/${y}]</span>`;
}

/* ── Filtering ── */
function applyFilter(series, filter) {
  if (filter === 'all') return series;
  return series.filter(s => {
    if (filter === 'normal') return s.series_status === '正常';
    if (filter === 'offline') return s.series_status === '下架';
    if (filter === 'purchased') return s.series_status === '已购买';
    if (filter === 'cansell') return s.hasCanSell;
    return true;
  });
}

/* ── Render ── */
function render(seriesList, query) {
  const container = document.getElementById('mainContainer');
  const q = (query||'').trim().toLowerCase();

  let filtered = applyFilter(seriesList, currentFilter);

  if (q) {
    const result = [];
    filtered.forEach(s => {
      const sm = s.series_name.toLowerCase().includes(q);
      if (sm) result.push(s);
    });
    filtered = result;
  }

  const total = applyFilter(seriesList, currentFilter).length;
  document.getElementById('searchCount').textContent = `${filtered.length}/${total} 系列`;

  if (!filtered.length) {
    container.innerHTML = `<div class="no-results"><div class="big">🔭</div><p>没有找到匹配的系列</p><p style="font-size:.85rem">试试其他关键词或筛选条件</p></div>`;
    return;
  }

  let html = '';

  filtered.forEach((s, idx) => {
    const sid = s.series_id;
    const url = `https://m.weishi100.com/mweb/series/?id=${encodeURIComponent(sid)}`;

    html += `<div class="series-row" style="animation-delay:${Math.min(idx*0.04,0.6)}s">`;
    html += `<a class="series-name" href="${esc(url)}" target="_blank" rel="noopener">${hl(s.series_name,q)}</a>`;
    html += statusBadge(s.series_status);
    html += `<span class="solo-stat">${soloStat(s)}</span>`;
    html += `</div>`;
  });

  container.innerHTML = html;
}

/* ── Error / File fallback ── */
function showError(msg) {
  document.getElementById('mainContainer').innerHTML = `
    <div class="error-box">
      <div class="err-icon">😵</div>
      <p>${esc(msg)}</p>
      <p>请选择本地 CSV 文件加载：</p>
      <label class="file-btn" for="fileInput">📂 选择 CSV 文件</label>
      <input type="file" id="fileInput" accept=".csv" onchange="handleFile(this)">
    </div>`;
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => loadFromText(e.target.result);
  reader.readAsText(file, 'UTF-8');
}

function loadFromText(text) {
  const rows = parseCSV(text);
  if (!rows.length) { showError('CSV 解析失败或无数据'); return; }
  allSeries = processData(rows);
  updateStats(allSeries);
  render(allSeries, '');
}

/* ── Search ── */
let searchTimer;
document.getElementById('searchBox').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const v = this.value;
  searchTimer = setTimeout(() => { if (allSeries.length) render(allSeries, v); }, 150);
});

/* ── Filter Chips ── */
document.getElementById('filterRow').addEventListener('click', function(e) {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  currentFilter = chip.dataset.filter;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  render(allSeries, document.getElementById('searchBox').value);
});

/* ── Theme Toggle ── */
const themeBtn = document.getElementById('themeBtn');
let darkMode = true;
themeBtn.addEventListener('click', () => {
  darkMode = !darkMode;
  document.body.classList.toggle('light', !darkMode);
  themeBtn.textContent = darkMode ? '🌙' : '☀️';
});

/* ── Scroll to Top ── */
const stb = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', () => {
  stb.classList.toggle('show', window.scrollY > 400);
  // progress bar
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h > 0 ? (window.scrollY / h * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
});
stb.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ── Init ── */
(async () => {
  const pb = document.getElementById('progressBar');
  pb.style.width = '30%';
  try {
    const resp = await fetch(CSV_URL);
    pb.style.width = '60%';
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    pb.style.width = '90%';
    loadFromText(text);
    pb.style.width = '100%';
    setTimeout(() => pb.style.opacity = '0', 500);
  } catch (err) {
    pb.style.width = '100%'; pb.style.background = 'var(--red)';
    showError(`远程加载失败: ${err.message}`);
  }
})();
</script>
</body>
</html>
